# Optional Traefik integration for Hostinger or any external Traefik container.
#
# Usage:
#   TRAEFIK_DOMAIN=your-temp-domain.example \
#   TRAEFIK_NETWORK=traefik-yuy7_default \
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#
# Find the Traefik network with:
#   docker network ls | grep traefik

services:
  web:
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-yuy7_default}
      - traefik.http.routers.voicevault-http.rule=Host(`${TRAEFIK_DOMAIN:-voicevault.localhost}`)
      - traefik.http.routers.voicevault-http.entrypoints=web
      - traefik.http.routers.voicevault-http.middlewares=voicevault-redirect-https
      - traefik.http.routers.voicevault.rule=Host(`${TRAEFIK_DOMAIN:-voicevault.localhost}`)
      - traefik.http.routers.voicevault.entrypoints=websecure
      - traefik.http.routers.voicevault.tls=true
      - traefik.http.services.voicevault.loadbalancer.server.port=3000
      - traefik.http.middlewares.voicevault-redirect-https.redirectscheme.scheme=https

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-yuy7_default}
