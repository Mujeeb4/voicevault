# Local stack. Each image is built from its own service directory.
name: voicevault

x-backend: &backend
  image: voicevault-backend:local
  build:
    context: ./backend
  env_file:
    - path: ${BACKEND_ENV_FILE:-./backend/.env}
      required: false
  environment: &backend-environment
    DEBUG: "True"
    SECRET_KEY: local-development-secret-change-before-hosting
    ALLOWED_HOSTS: localhost,127.0.0.1,backend
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/voicevault
    DB_SSL_REQUIRE: "False"
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: local
    LOCAL_STORAGE_PUBLIC_URL: ${SITE_URL:-http://localhost:3000}
    FRONTEND_URL: ${SITE_URL:-http://localhost:3000}
    CORS_ALLOWED_ORIGINS: ${SITE_URL:-http://localhost:3000}
    CSRF_TRUSTED_ORIGINS: ${SITE_URL:-http://localhost:3000}
    SECURE_SSL_REDIRECT: "False"
    SESSION_COOKIE_SECURE: "False"
    CSRF_COOKIE_SECURE: "False"
    PORT: "8000"
  restart: unless-stopped
  volumes:
    - media_data:/app/media

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voicevault
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voicevault"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    command: ["web"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: voicevault-frontend:local
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://backend:8000/api
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MEDIA_ORIGINS: ${MEDIA_ORIGINS:-}
        NEXT_PUBLIC_GA_TRACKING_ID: ${GA_TRACKING_ID:-}
    environment:
      BACKEND_API_URL: http://backend:8000/api
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_MEDIA_ORIGINS: ${MEDIA_ORIGINS:-}
      PORT: "3000"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    volumes:
      - media_data:/app/media
      - beat_data:/app/run
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  beat_data:
